<title>조직 진단 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EEF2F6;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#0F1B2D;--muted:#586577;--faint:#8C97A6;--line:#DCE2EA;--line-strong:#B9C3D0;--grid:#E7EBF0;--axis:#C5CDD7;
  --accent:#2A4FB8;--accent-ink:#FFFFFF;--accent-soft:#E6ECFA;
  --band:#12224A;--band-2:#182C5E;--band-ink:#FFFFFF;--band-muted:#A9B8DC;--band-line:rgba(255,255,255,.14);--band-chip:rgba(255,255,255,.10);
  --s1:#2a78d6;--s1-soft:#cde2fb;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#104281;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--good-ink:#006300;--crit-ink:#B3352F;--warn-ink:#8A5A00;
  --warn-soft:#FFF1D6;--crit-soft:#FBE5E3;--good-soft:#E1F1E7;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 6px 16px rgba(15,27,45,.05);
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#0E141C;--surface:#161D27;--surface-2:#1C2430;--ink:#E7ECF2;--muted:#9AA6B5;--faint:#6F7B8A;--line:#273140;--line-strong:#3A4656;--grid:#222B37;--axis:#3A4656;
  --accent:#8AA8F5;--accent-ink:#0B1330;--accent-soft:#1E2A4A;
  --band:#0B1326;--band-2:#101B36;--band-ink:#F2F5FA;--band-muted:#8A9BC4;--band-line:rgba(255,255,255,.12);--band-chip:rgba(255,255,255,.08);
  --s1:#3987e5;--s1-soft:#184f95;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#6da7ec;--o5:#9ec5f4;
  --good-ink:#0ca30c;--crit-ink:#EF8681;--warn-ink:#E6B65A;--warn-soft:#3A2D0F;--crit-soft:#3E1D1C;--good-soft:#16321F;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#0E141C;--surface:#161D27;--surface-2:#1C2430;--ink:#E7ECF2;--muted:#9AA6B5;--faint:#6F7B8A;--line:#273140;--line-strong:#3A4656;--grid:#222B37;--axis:#3A4656;
  --accent:#8AA8F5;--accent-ink:#0B1330;--accent-soft:#1E2A4A;
  --band:#0B1326;--band-2:#101B36;--band-ink:#F2F5FA;--band-muted:#8A9BC4;--band-line:rgba(255,255,255,.12);--band-chip:rgba(255,255,255,.08);
  --s1:#3987e5;--s1-soft:#184f95;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#6da7ec;--o5:#9ec5f4;
  --good-ink:#0ca30c;--crit-ink:#EF8681;--warn-ink:#E6B65A;--warn-soft:#3A2D0F;--crit-soft:#3E1D1C;--good-soft:#16321F;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 32px;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}

/* ── 상단 밴드 ─────────────────────────────── */
.band{background:linear-gradient(90deg,var(--band),var(--band-2));color:var(--band-ink);margin-inline:-16px;padding-inline:16px;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:56px;padding-block:8px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--band-chip);display:grid;place-items:center;border:1px solid var(--band-line)}
.brand .mark svg{width:18px;height:18px;stroke:var(--band-ink);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--band-muted);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);line-height:1.2}
.tabs{display:flex;gap:2px;background:var(--band-chip);border:1px solid var(--band-line);border-radius:10px;padding:3px}
.tabs a{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;font-size:13px;color:var(--band-muted);text-decoration:none;font-weight:500}
.tabs a[aria-current="page"]{background:var(--band-ink);color:var(--band)}
.tabs a:not([aria-current]):hover{color:var(--band-ink)}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--band-muted)}.meta b{color:var(--band-ink);font-weight:600;font-family:var(--mono);font-size:13px}
.spacer{flex:1}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}.pill.crit{background:var(--crit-soft);color:var(--crit-ink);border-color:transparent}.pill.good{background:var(--good-soft);color:var(--good-ink);border-color:transparent}.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ── 필터 + 구역 이동 ───────────────────────── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;font-size:13px;color:var(--muted);max-width:1240px;margin:0 auto}
.filters label{font-weight:500}
.filters select{padding:6px 30px 6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.filters .sep{width:1px;height:20px;background:var(--line)}
.jump{display:flex;gap:4px;flex-wrap:wrap}
.jump button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:500}
.jump button:hover{background:var(--surface);color:var(--ink)}
.jump button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}

/* ── 지표 타일 ─────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-block:16px 8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px 12px}
.tile .l{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:28px;font-weight:600;line-height:1.15;margin-top:4px;letter-spacing:-.02em}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px;letter-spacing:0}
.tile .d{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.tile .d.up{color:var(--crit-ink)}.tile .d.dn{color:var(--good-ink)}
.tile .d.up::before{content:"▲ ";font-size:9px}.tile .d.dn::before{content:"▼ ";font-size:9px}

/* ── 구역과 카드 ───────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:6px}
.sec{grid-column:span 12;display:flex;align-items:baseline;gap:12px;padding:22px 2px 2px;scroll-margin-top:64px}
.sec h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.sec .n{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:6px}
.sec .s{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 18px 14px;grid-column:span 12;min-width:0}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}
@media (max-width:900px){.c6,.c4,.c8{grid-column:span 12}}
.card h2{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.card h2 .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:0}
.card .hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}.card .hd .sp{flex:1}
.tv{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;color:var(--muted);font-weight:500}
.tv:hover{border-color:var(--line-strong);color:var(--ink)}
.tv[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
svg{display:block;max-width:100%;height:auto;font-family:var(--sans)}
svg text{fill:var(--muted);font-size:11.5px}svg text.v{fill:var(--ink);font-weight:500}svg text.lab{fill:var(--ink);font-size:12.5px}
svg .grid{stroke:var(--grid);stroke-width:1}svg .axis{stroke:var(--axis);stroke-width:1}
svg .bar{fill:var(--s1)}svg .bar:hover,svg .seg:hover{filter:brightness(1.12)}
svg .hit{fill:transparent;cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}td.n,th.n{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
.tw{overflow-x:auto}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:6px;z-index:20;max-width:280px;line-height:1.35}
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fam .f{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}.fam .f b{font-size:15px}.fam .f .m{font-size:12px;color:var(--muted);font-family:var(--mono)}.fam .f .t{font-size:12.5px;margin-top:6px;color:var(--muted);line-height:1.45}
.ledger .e{border-left:3px solid var(--axis);padding:2px 0 2px 12px;margin-bottom:10px;font-size:13px;line-height:1.5}.ledger .e.unc{border-left-color:var(--warn)}.ledger .e .m{color:var(--muted);font-size:12px}
.foot{font-size:11.5px;color:var(--faint);margin-top:22px;display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer}.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:700px){.meta{display:none}.jump{display:none}}
</style>

<div class="band"><header class="top">
  <a class="brand" href="#"><span class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2v4.3M12 11.5 6.2 17M12 11.5l5.8 5.5"/></svg></span><span><b>조직 시뮬레이터</b><small>Org Structure Studio</small></span></a>
  <nav class="tabs" aria-label="페이지">

  </nav>
  <div class="meta" id="meta"><span>데이터 불러오는 중…</span></div>
  <span class="spacer"></span>
</header></div>

<div class="bar"><div class="filters">
  <label for="hq">본부</label><select id="hq"><option value="">전체</option></select>
  <span id="filterNote"></span>
  <span class="spacer"></span>
  <nav class="jump" id="jump" aria-label="구역 이동"></nav>
</div></div>

<div class="wrap">
<div class="tiles" id="tiles"></div>
<div class="grid" id="grid"></div>
<footer class="foot">
  <span id="footData"></span><span>팀 단위 집계만 포함 — 사번·나이·성별 없음</span><span>지역은 조직명에서 추론</span><span>기능 분류 사전은 시드 상태 — 기능 지도는 과다 집계 가능</span><span>승계 이력은 구성원 이동으로 추정</span>
</footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: d });
const r1 = (x) => Math.round(x * 10) / 10;
const S = { data: null, hq: "", decisions: [], directives: [], opinions: [] };

// ------------------------------------------------------------ 차트 도우미 (SVG, 얇은 마크, 헤어라인 격자, 표 보기)
function tipOn(el, html) { el.addEventListener("mousemove", (e) => { const t = $("#tip"); t.innerHTML = html; t.hidden = false; t.style.left = Math.min(e.clientX + 12, innerWidth - 300) + "px"; t.style.top = (e.clientY + 14) + "px"; }); el.addEventListener("mouseleave", () => { $("#tip").hidden = true; }); }
function hbars(rows, { label, value, fmtv = (v) => fmt(v), max, unit = "", labelW = 150, tip }) {
  // 가로 막대: 값은 막대 끝에, 라벨은 왼쪽. 24px 이하 두께, 데이터 끝 4px 둥글게.
  const H = 22, GAP = 6, W = 640, mx = max ?? Math.max(1, ...rows.map((r) => r[value]));
  const plotW = W - labelW - 70; const h = rows.length * (H + GAP) + 6;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  rows.forEach((r, i) => { const y = i * (H + GAP) + 3, w = Math.max(0, r[value] / mx * plotW); const lab = String(r[label]); const short = lab.length > 14 ? lab.slice(0, 13) + "…" : lab;
    s += `<text class="lab" x="${labelW - 8}" y="${y + 15}" text-anchor="end">${esc(short)}</text><path class="bar" d="M${labelW},${y} h${Math.max(w - 4, 0)} a4,4 0 0 1 4,4 v${H - 8} a4,4 0 0 1 -4,4 h-${Math.max(w - 4, 0)} z"/><text class="v" x="${labelW + w + 6}" y="${y + 15}">${esc(fmtv(r[value]))}${unit}</text><rect class="hit" data-i="${i}" x="0" y="${y - 2}" width="${W}" height="${H + 4}"/>`; });
  s += `<line class="axis" x1="${labelW}" y1="0" x2="${labelW}" y2="${h}"/></svg>`;
  const wrap = document.createElement("div"); wrap.innerHTML = s; wrap.querySelectorAll(".hit").forEach((el) => tipOn(el, tip ? tip(rows[+el.dataset.i]) : `${esc(rows[+el.dataset.i][label])}: ${esc(fmtv(rows[+el.dataset.i][value]))}${unit}`));
  return wrap;
}
function columns(rows, { label, value, fmtv = (v) => fmt(v), yTicks = 3, tip, height = 150, width = 320 }) {
  const W = width, H = height, padL = 44, padB = 26, padT = 12, plotW = W - padL - 8, plotH = H - padB - padT; const mx = Math.max(1, ...rows.map((r) => r[value])) * 1.12;
  const band = plotW / rows.length, bw = Math.min(24, band * 0.6);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let k = 0; k <= yTicks; k++) { const v = mx * k / yTicks, y = padT + plotH - v / mx * plotH; s += `<line class="grid" x1="${padL}" y1="${y}" x2="${W - 8}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  rows.forEach((r, i) => { const x = padL + band * i + (band - bw) / 2, h = r[value] / mx * plotH, y = padT + plotH - h;
    s += `<path class="bar" d="M${x},${padT + plotH} v-${Math.max(h - 4, 0)} a4,4 0 0 1 4,-4 h${bw - 8} a4,4 0 0 1 4,4 v${Math.max(h - 4, 0)} z"/><text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(r[label])}</text>`;
    if (i === rows.length - 1) s += `<text class="v" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${esc(fmtv(r[value]))}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${padL + band * i}" y="${padT}" width="${band}" height="${plotH}"/>`; });
  s += `<line class="axis" x1="${padL}" y1="${padT + plotH}" x2="${W - 8}" y2="${padT + plotH}"/></svg>`;
  const wrap = document.createElement("div"); wrap.innerHTML = s; wrap.querySelectorAll(".hit").forEach((el) => tipOn(el, tip ? tip(rows[+el.dataset.i]) : `${esc(rows[+el.dataset.i][label])}: ${esc(fmtv(rows[+el.dataset.i][value]))}`));
  return wrap;
}
function stacked(rows, { label, keys, colors, names }) {
  // 100% 누적 가로 막대 (순서형 램프). 2px 표면 간격.
  const W = 640, H = 22, GAP = 8, labelW = 110, plotW = W - labelW - 60; const h = rows.length * (H + GAP) + 4;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  rows.forEach((r, i) => { const y = i * (H + GAP) + 2, total = keys.reduce((a, k) => a + (r[k] || 0), 0) || 1; let x = labelW;
    s += `<text class="lab" x="${labelW - 8}" y="${y + 15}" text-anchor="end">${esc(r[label])}</text>`;
    keys.forEach((k, j) => { const w = (r[k] || 0) / total * plotW; if (w > 0) { s += `<rect class="seg" data-i="${i}" data-k="${k}" x="${x + 1}" y="${y}" width="${Math.max(w - 2, 0)}" height="${H}" rx="${j === keys.length - 1 ? 4 : 0}" fill="${colors[j]}"/>`; if (w > 34) s += `<text x="${x + w / 2}" y="${y + 15}" text-anchor="middle" style="fill:${j >= 2 ? "#fff" : "var(--ink)"}">${r[k]}</text>`; } x += w; });
    s += `<text class="v" x="${labelW + plotW + 8}" y="${y + 15}">${total}</text>`; });
  s += `</svg>`;
  const wrap = document.createElement("div"); wrap.style.maxWidth = "760px"; wrap.innerHTML = `<div class="legend">${keys.map((k, j) => `<span><i style="background:${colors[j]}"></i>${esc(names[j])}</span>`).join("")}</div>` + s;
  wrap.querySelectorAll(".seg").forEach((el) => tipOn(el, `${esc(rows[+el.dataset.i][label])} · ${esc(names[keys.indexOf(el.dataset.k)])}: ${rows[+el.dataset.i][el.dataset.k]}건`));
  return wrap;
}
function table(rows, cols) {
  if (!rows.length) return `<div class="note">해당 없음</div>`;
  return `<div class="tw"><table><thead><tr>${cols.map((c) => `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.n ? "n" : ""}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

  if ((D.region_profile || []).length) g.append(card({ title: "권역별 현황", span: 6, chart: hbars(D.region_profile, { label: "권역", value: "인원", unit: "명", tip: (r) => `${r.권역}: ${r.팀수}팀 · ${r.인원}명 · 평균 ${r.평균연령}세` }), tableHtml: table(D.region_profile, [{ h: "권역", k: "권역" }, { h: "팀", k: "팀수", n: 1 }, { h: "인원", k: "인원", n: 1 }, { h: "평균 연령", k: "평균연령", n: 1 }, { h: "팀당", k: "팀당인원", n: 1 }]) }));
  // 원장
  g.append(sec("ledger"));
  const dirs = S.directives.filter((d) => d.status !== "철회" && d.status !== "만료");
  g.append(card({ title: "전제 — 지침", sub: `${dirs.length}건 · 미확인 ${dirs.filter((d) => d.status === "미확인").length} · 철회·만료 제외`, span: 4, chart: `<div class="ledger">${dirs.map((d) => `<div class="e ${d.status === "미확인" ? "unc" : ""}"><b>${esc(d.id)}</b> <span class="pill">${esc(d.kind)}·${esc(d.force)}</span> ${d.status === "미확인" ? '<span class="pill warn">미확인</span>' : ""}<div>${esc(d.text)}</div><div class="m">${esc(d.source)}${d.rule ? " · " + esc(d.rule) : ""}${d.edited_on ? " · 수정 " + esc(d.edited_on) : ""}</div></div>`).join("") || '<div class="note">없음</div>'}</div>` }));
  g.append(card({ title: "판정", sub: `${S.decisions.length}건`, span: 4, chart: `<div class="ledger">${[...S.decisions].reverse().map((d) => `<div class="e"><b>${esc(d.verdict)}</b> · ${esc(d.label)}<div>${esc(d.reason)}</div><div class="m">${esc(d.kind)} · ${esc(d.by || "")} ${esc(d.on || "")}</div></div>`).join("") || '<div class="note">없음</div>'}</div>` }));
  const STANCE = { 반대: "crit", 조건부: "warn", 찬성: "good", 보류: "" }; const ops = S.opinions.filter((o) => !hq || o.org === hq || D.teams.some((t) => t.hq === hq && (t.name === o.org || t.dept === o.org)));
  g.append(card({ title: "현업 의견", sub: `${ops.length}건 · 사실이 아니라 입장 — 출처(역할)와 함께`, span: 4, chart: `<div class="ledger">${[...ops].reverse().map((o) => `<div class="e"><span class="pill ${STANCE[o.stance] || ""}">${esc(o.stance)}</span> <b>${esc(o.org)}</b><div>${esc(o.text)}</div><div class="m">${esc(o.by || "")} · ${esc(o.channel || "")} ${esc(o.on || "")}</div></div>`).join("") || '<div class="note">아직 없음 — 시뮬레이션 페이지에서 개편안에 붙여 기록합니다.</div>'}</div>` }));
}
load().catch((e) => { $("#meta").innerHTML = '<span class="pill crit">데이터를 불러오지 못했습니다</span>'; console.error(e); });
})();
</script>
