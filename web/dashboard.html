<title>조직 진단 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F3F5F7;--surface:#FFFFFF;--ink:#17202A;--muted:#5F6B78;--faint:#8A95A1;--line:#D8DEE5;--grid:#E6EAEF;--axis:#C3CAD2;
  --accent:#1E6F6B;--accent-soft:#E3F0EF;
  --s1:#2a78d6;--s1-soft:#cde2fb;--o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#104281;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--good-ink:#006300;
  --warn-soft:#FFF4D6;--crit-soft:#FBE7E6;--good-soft:#E3F1E8;
  --shadow:0 1px 2px rgba(23,32,42,.06),0 4px 12px rgba(23,32,42,.05);
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#12171C;--surface:#1A2027;--ink:#E6EAEE;--muted:#9AA5B1;--faint:#7C8793;--line:#2A333D;--grid:#242C35;--axis:#3B4650;
  --accent:#5FB3AE;--accent-soft:#173634;--s1:#3987e5;--s1-soft:#184f95;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#6da7ec;--o5:#9ec5f4;
  --good-ink:#0ca30c;--warn-soft:#3A2E10;--crit-soft:#3D1E1D;--good-soft:#173324;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#12171C;--surface:#1A2027;--ink:#E6EAEE;--muted:#9AA5B1;--faint:#7C8793;--line:#2A333D;--grid:#242C35;--axis:#3B4650;
  --accent:#5FB3AE;--accent-soft:#173634;--s1:#3987e5;--s1-soft:#184f95;--o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#6da7ec;--o5:#9ec5f4;
  --good-ink:#0ca30c;--warn-soft:#3A2E10;--crit-soft:#3D1E1D;--good-soft:#173324;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;padding-inline:16px;padding-block:0 24px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 12px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.top h1{font-size:17px;font-weight:600;margin:0}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.meta b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13px}
:root[data-theme="dark"] .link{color:#0E1B1A}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:#0E1B1A}}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:12px 4px;font-size:13px;color:var(--muted)}
.filters select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:12px 6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .l{font-size:12px;color:var(--muted)}.tile .v{font-size:26px;font-weight:600;line-height:1.15;margin-top:2px}.tile .d{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.tile .d.up{color:var(--crit)}.tile .d.dn{color:var(--good-ink)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;box-shadow:var(--shadow);grid-column:span 12;min-width:0}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}
@media (max-width:900px){.c6,.c4,.c8{grid-column:span 12}}
.card h2{font-size:14px;font-weight:600;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-size:12px;color:var(--muted);font-weight:400}
.card .hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}.card .hd .sp{flex:1}
.tv{font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;flex:none}
.tv[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
svg{display:block;max-width:100%;height:auto;font-family:var(--sans)}
svg text{fill:var(--muted);font-size:11.5px}svg text.v{fill:var(--ink)}svg text.lab{fill:var(--ink);font-size:12.5px}
svg .grid{stroke:var(--grid);stroke-width:1}svg .axis{stroke:var(--axis);stroke-width:1}
svg .bar{fill:var(--s1)}svg .bar:hover,svg .seg:hover{filter:brightness(1.12)}
svg .hit{fill:transparent;cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);white-space:nowrap}
.pill.warn{background:var(--warn-soft);border-color:transparent}.pill.crit{background:var(--crit-soft);border-color:transparent}.pill.good{background:var(--good-soft);border-color:transparent}.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:6px;z-index:20;max-width:280px;line-height:1.35}
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fam .f{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.fam .f b{font-size:15px}.fam .f .m{font-size:12px;color:var(--muted);font-family:var(--mono)}.fam .f .t{font-size:12.5px;margin-top:6px;color:var(--muted)}
.ledger .e{border-left:3px solid var(--axis);padding:2px 0 2px 10px;margin-bottom:8px;font-size:13px}.ledger .e.unc{border-left-color:var(--warn)}.ledger .e .m{color:var(--muted);font-size:12px;font-family:var(--mono)}
.foot{font-size:12px;color:var(--muted);margin-top:18px;display:flex;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer}.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <h1>조직 진단 대시보드</h1>
  <div class="meta" id="meta"><span>데이터 불러오는 중…</span></div>
  <span class="spacer"></span>
  <a class="link" id="simLink" href="https://claude.ai/artifact/HQ3KzvEESS1LVXqyefTGmV" target="_blank" rel="noopener">시뮬레이션으로 →</a>
</header>

<div class="filters">
  <label for="hq">본부</label><select id="hq"><option value="">전체</option></select>
  <span id="filterNote"></span>
</div>

<div class="tiles" id="tiles"></div>
<div class="grid" id="grid"></div>
<footer class="foot">
  <span id="footData"></span><span>팀 단위 집계만 포함 — 사번·나이·성별 없음</span><span>지역은 조직명에서 추론</span><span>기능 분류 사전은 시드 상태 — 기능 지도는 과다 집계 가능</span><span>승계 이력은 구성원 이동으로 추정</span>
</footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: d });
const r1 = (x) => Math.round(x * 10) / 10;
const S = { data: null, hq: "", decisions: [], directives: [] };

// ------------------------------------------------------------ 차트 도우미 (SVG, 얇은 마크, 헤어라인 격자, 표 보기)
function tipOn(el, html) { el.addEventListener("mousemove", (e) => { const t = $("#tip"); t.innerHTML = html; t.hidden = false; t.style.left = Math.min(e.clientX + 12, innerWidth - 300) + "px"; t.style.top = (e.clientY + 14) + "px"; }); el.addEventListener("mouseleave", () => { $("#tip").hidden = true; }); }
function hbars(rows, { label, value, fmtv = (v) => fmt(v), max, unit = "", labelW = 150, tip }) {
  // 가로 막대: 값은 막대 끝에, 라벨은 왼쪽. 24px 이하 두께, 데이터 끝 4px 둥글게.
  const H = 22, GAP = 6, W = 640, mx = max ?? Math.max(1, ...rows.map((r) => r[value]));
  const plotW = W - labelW - 70; const h = rows.length * (H + GAP) + 6;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  rows.forEach((r, i) => { const y = i * (H + GAP) + 3, w = Math.max(0, r[value] / mx * plotW); const lab = String(r[label]); const short = lab.length > 14 ? lab.slice(0, 13) + "…" : lab;
    s += `<text class="lab" x="${labelW - 8}" y="${y + 15}" text-anchor="end">${esc(short)}</text><path class="bar" d="M${labelW},${y} h${Math.max(w - 4, 0)} a4,4 0 0 1 4,4 v${H - 8} a4,4 0 0 1 -4,4 h-${Math.max(w - 4, 0)} z"/><text class="v" x="${labelW + w + 6}" y="${y + 15}">${esc(fmtv(r[value]))}${unit}</text><rect class="hit" data-i="${i}" x="0" y="${y - 2}" width="${W}" height="${H + 4}"/>`; });
  s += `<line class="axis" x1="${labelW}" y1="0" x2="${labelW}" y2="${h}"/></svg>`;
  const wrap = document.createElement("div"); wrap.innerHTML = s; wrap.querySelectorAll(".hit").forEach((el) => tipOn(el, tip ? tip(rows[+el.dataset.i]) : `${esc(rows[+el.dataset.i][label])}: ${esc(fmtv(rows[+el.dataset.i][value]))}${unit}`));
  return wrap;
}
function columns(rows, { label, value, fmtv = (v) => fmt(v), yTicks = 3, tip, height = 150, width = 320 }) {
  const W = width, H = height, padL = 44, padB = 26, padT = 12, plotW = W - padL - 8, plotH = H - padB - padT; const mx = Math.max(1, ...rows.map((r) => r[value])) * 1.12;
  const band = plotW / rows.length, bw = Math.min(24, band * 0.6);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let k = 0; k <= yTicks; k++) { const v = mx * k / yTicks, y = padT + plotH - v / mx * plotH; s += `<line class="grid" x1="${padL}" y1="${y}" x2="${W - 8}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  rows.forEach((r, i) => { const x = padL + band * i + (band - bw) / 2, h = r[value] / mx * plotH, y = padT + plotH - h;
    s += `<path class="bar" d="M${x},${padT + plotH} v-${Math.max(h - 4, 0)} a4,4 0 0 1 4,-4 h${bw - 8} a4,4 0 0 1 4,4 v${Math.max(h - 4, 0)} z"/><text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(r[label])}</text>`;
    if (i === rows.length - 1) s += `<text class="v" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${esc(fmtv(r[value]))}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${padL + band * i}" y="${padT}" width="${band}" height="${plotH}"/>`; });
  s += `<line class="axis" x1="${padL}" y1="${padT + plotH}" x2="${W - 8}" y2="${padT + plotH}"/></svg>`;
  const wrap = document.createElement("div"); wrap.innerHTML = s; wrap.querySelectorAll(".hit").forEach((el) => tipOn(el, tip ? tip(rows[+el.dataset.i]) : `${esc(rows[+el.dataset.i][label])}: ${esc(fmtv(rows[+el.dataset.i][value]))}`));
  return wrap;
}
function stacked(rows, { label, keys, colors, names }) {
  // 100% 누적 가로 막대 (순서형 램프). 2px 표면 간격.
  const W = 640, H = 22, GAP = 8, labelW = 110, plotW = W - labelW - 60; const h = rows.length * (H + GAP) + 4;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  rows.forEach((r, i) => { const y = i * (H + GAP) + 2, total = keys.reduce((a, k) => a + (r[k] || 0), 0) || 1; let x = labelW;
    s += `<text class="lab" x="${labelW - 8}" y="${y + 15}" text-anchor="end">${esc(r[label])}</text>`;
    keys.forEach((k, j) => { const w = (r[k] || 0) / total * plotW; if (w > 0) { s += `<rect class="seg" data-i="${i}" data-k="${k}" x="${x + 1}" y="${y}" width="${Math.max(w - 2, 0)}" height="${H}" rx="${j === keys.length - 1 ? 4 : 0}" fill="${colors[j]}"/>`; if (w > 34) s += `<text x="${x + w / 2}" y="${y + 15}" text-anchor="middle" style="fill:${j >= 2 ? "#fff" : "var(--ink)"}">${r[k]}</text>`; } x += w; });
    s += `<text class="v" x="${labelW + plotW + 8}" y="${y + 15}">${total}</text>`; });
  s += `</svg>`;
  const wrap = document.createElement("div"); wrap.innerHTML = `<div class="legend">${keys.map((k, j) => `<span><i style="background:${colors[j]}"></i>${esc(names[j])}</span>`).join("")}</div>` + s;
  wrap.querySelectorAll(".seg").forEach((el) => tipOn(el, `${esc(rows[+el.dataset.i][label])} · ${esc(names[keys.indexOf(el.dataset.k)])}: ${rows[+el.dataset.i][el.dataset.k]}건`));
  return wrap;
}
function table(rows, cols) {
  if (!rows.length) return `<div class="note">해당 없음</div>`;
  return `<div class="tw"><table><thead><tr>${cols.map((c) => `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.n ? "n" : ""}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function card({ title, sub, span = 12, chart, tableHtml, note }) {
  const el = document.createElement("section"); el.className = `card c${span}`;
  el.innerHTML = `<div class="hd"><h2>${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</h2><span class="sp"></span>${chart && tableHtml ? '<button class="tv" aria-pressed="false">표로 보기</button>' : ""}</div><div class="chart"></div><div class="tbl" hidden></div>${note ? `<div class="note">${note}</div>` : ""}`;
  const c = el.querySelector(".chart"), t = el.querySelector(".tbl");
  if (chart) (typeof chart === "string" ? (c.innerHTML = chart) : c.append(chart)); if (tableHtml) t.innerHTML = tableHtml;
  if (chart && tableHtml) { const b = el.querySelector(".tv"); b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); c.hidden = on; t.hidden = !on; b.textContent = on ? "차트로 보기" : "표로 보기"; }; }
  else if (!chart && tableHtml) { t.hidden = false; }
  return el;
}

// ------------------------------------------------------------ 데이터
async function load() {
  const demo = location.hash === "#demo";
  S.data = await (await fetch(demo ? "data_demo.json" : "data.json")).json();
  S.decisions = (S.data.decisions_seed || []).map((d) => ({ kind: d.kind, label: d.label, verdict: d.verdict, reason: d.reason, by: d.decided_by, on: d.decided_on }));
  S.directives = (S.data.directives || []).map((d) => ({ id: d.id, source: d.출처, kind: d.구분, force: d.효력, status: d.상태, text: d.내용 }));
  const m = S.data.meta;
  $("#meta").innerHTML = `<span><b>${m.year}년 1월</b> 기준</span><span><b>${fmt(m.people)}</b>명</span><span>팀 <b>${m.teams}</b></span>${demo ? '<span class="pill warn">합성 데이터</span>' : ""}`;
  $("#footData").textContent = `데이터 생성 ${m.generated}`;
  if (demo) $("#simLink").href += "#demo";
  const hqs = [...new Set(S.data.teams.map((t) => t.hq))].sort((a, b) => a.localeCompare(b, "ko"));
  $("#hq").innerHTML = '<option value="">전체</option>' + hqs.map((h) => `<option>${esc(h)}</option>`).join("");
  $("#hq").onchange = (e) => { S.hq = e.target.value; render(); };
  render();
  const db = await window.claude?.use?.("db").catch(() => null);
  if (db) { db.collection("decisions").onSnapshot((snap) => { const seed = S.decisions.filter((d) => !d.live); S.decisions = [...seed, ...snap.docs.map((d) => ({ ...d.data(), live: true }))]; render(); }, () => {});
            db.collection("directives").onSnapshot((snap) => { const seed = S.directives.filter((d) => !d.live); S.directives = [...seed, ...snap.docs.map((d) => ({ ...d.data(), live: true }))]; render(); }, () => {}); }
}

// ------------------------------------------------------------ 렌더
function render() {
  const D = S.data, hq = S.hq; const teams = D.teams.filter((t) => !t.leader_only && (!hq || t.hq === hq));
  $("#filterNote").textContent = hq ? `${hq} 기준 — 팀 ${teams.length}개 · ${fmt(teams.reduce((a, t) => a + t.headcount, 0))}명` : "";
  const people = teams.reduce((a, t) => a + t.headcount, 0), ageSum = teams.reduce((a, t) => a + t.age_sum, 0), ageN = teams.reduce((a, t) => a + t.age_n, 0);
  const over50 = teams.reduce((a, t) => a + t.over50, 0), retire5 = teams.reduce((a, t) => a + t.retire5, 0);
  const leaders = D.teams.filter((t) => !hq || t.hq === hq).reduce((a, t) => a + t.leaders + t.upper_leaders, 0), peopleAll = D.teams.filter((t) => !hq || t.hq === hq).reduce((a, t) => a + t.headcount, 0);
  const as = D.age_structure || [], first = as[0], last = as[as.length - 1];
  const dl = (cur, prev, d = 1, unit = "") => prev == null ? "" : `${cur - prev >= 0 ? "+" : ""}${fmt(cur - prev, d)}${unit} vs ${first.year}`;
  const tiles = [
    { l: "인원", v: fmt(peopleAll), d: !hq && first ? dl(peopleAll, first.headcount, 0, "명") : "", cls: !hq && first && peopleAll < first.headcount ? "dn" : "" },
    { l: "팀", v: teams.length, d: "조직장 직할 슬롯 제외" },
    { l: "직책자 비율", v: r1(leaders / Math.max(peopleAll, 1) * 100) + "%", d: `${leaders}명` },
    { l: "평균 연령", v: r1(ageSum / Math.max(ageN, 1)), d: !hq && first ? dl(r1(ageSum / ageN), first.avg_age, 1, "세") : "", cls: "up" },
    { l: "50세 이상", v: Math.round(over50 / Math.max(people, 1) * 100) + "%", d: !hq && first ? dl(Math.round(over50 / people * 100), first.over_50_pct, 1, "%p") : `${fmt(over50)}명`, cls: "up" },
    { l: `5년 내 정년`, v: fmt(retire5), d: `${Math.round(retire5 / Math.max(people, 1) * 100)}% · 정년 ${D.meta.retire_age}세` },
  ];
  $("#tiles").innerHTML = tiles.map((t) => `<div class="tile"><div class="l">${esc(t.l)}</div><div class="v">${esc(t.v)}</div><div class="d ${t.d && t.cls ? t.cls : ""}">${esc(t.d)}</div></div>`).join("");

  const g = $("#grid"); g.innerHTML = "";
  // 3개년 추이 — 소형 다중
  if (as.length > 1 && !hq) {
    const trend = document.createElement("div"); trend.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px";
