# 조직명에서 근무 지역을 추론하기 위한 사전.
# 전국에 국사·사옥이 있는 구조에서는 조직 통합이 곧 인력 집중을 뜻하지 않는다.
# 대구구축팀과 부산구축팀을 합쳐도 사람은 대구와 부산에 그대로 남는다.
# 근무지(사업장/국사) 데이터가 확보되면 이 추론은 실제 값으로 대체해야 한다.

권역:
  수도권: [서울, 강남, 강북, 강서, 강동, 동작, 성북, 서대문, 수도권, 수남, 수북, 경기, 인천]
  충청: [대전, 충남, 충북, 충강, 천안, 세종]
  영남: [부산, 대구, 울산, 경남, 경북, 영남]
  호남: [광주, 전남, 전북, 전주, 호남]
  제주: [제주]
  강원: [강원]

# 회사 자체 권역 표기(방향형). 구체적 지역이 아니라 권역 단위를 가리킨다.
방향권역: [중부, 동부, 서부, 남부, 북부]

# 전국 단위 조직을 지역 조직으로 오인하지 않기 위한 예외
전국조직: [전국, 전사, 광역]
