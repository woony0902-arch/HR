name: "A안 — 명백한 중복만 정리 (보수)"
description: >
  동일 본부 내에서 기능이 겹치는 조직만 통합합니다. 사업부 구조는 건드리지 않아
  실행 난도가 가장 낮고, 노사·조직 저항이 최소인 안입니다.

actions:
  # 구매팀 + 소싱팀: 소싱팀 이관 후 같은 담당에 구매 기능이 두 개 남아 있는 상태
  - op: MERGE
    targets: [T1042, T2033]
    into: {code: T1044, name: "통합구매팀", dept_code: D104}
    keep_leader: T1042

  # 데이터플랫폼팀 + 데이터분석팀: 동일 담당 내 데이터 기능 중복
  - op: MERGE
    targets: [T4021, T4022]
    into: {code: T4024, name: "데이터팀", dept_code: D402}
    keep_leader: T4021
